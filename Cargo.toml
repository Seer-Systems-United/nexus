[package]
name = "nexus"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
console = { version = "0.16.3", features = ["std"] }
diesel = { version = "2.3.9", features = ["postgres", "r2d2", "chrono", "uuid"] }
diesel_full_text_search = "2.3.0"
dotenvy = "0.15.7"
human_name = "2.0.4"
pdf_oxide = "0.3.46"
rake = "0.3.6"
rayon = "1.12.0"
reqwest = { version = "0.11.27", features = ["blocking", "json"] }
rust-bert = "0.23.0"
rust-stemmers = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
stop-words = "0.10.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "yougov_parsing"
harness = false
